<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Plantão Fácil</title>
    <meta name="description" content="Apoio pessoal ao plantão médico: prescrições e calculadoras offline." />
    <meta name="theme-color" content="#eef1f6" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon-180x180.png" />
    <script>
      // Aplica tema e cor de destaque salvos antes do primeiro desenho (padrão: claro, verde).
      document.documentElement.dataset.destaque = 'verde'
      try {
        if (localStorage.getItem('plantao-facil:tema') === 'escuro') {
          document.documentElement.classList.add('dark')
          document.querySelector('meta[name="theme-color"]').setAttribute('content', '#0f1220')
        }
        var destaque = localStorage.getItem('plantao-facil:destaque')
        if (['azul', 'coral', 'verde', 'violeta'].indexOf(destaque) >= 0) document.documentElement.dataset.destaque = destaque
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
